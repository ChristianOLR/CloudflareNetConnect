name: Build Cross-Platform

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-binaries:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: Windows-x64
            os: windows-latest
            goos: windows
            goarch: amd64
            output: CloudflareNetConnect.exe
            ldflags: "-s -w -H windowsgui"
          - target: Linux-x64
            os: ubuntu-latest
            goos: linux
            goarch: amd64
            output: CloudflareNetConnect-linux
            ldflags: "-s -w"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Build Binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          go build -ldflags "${{ matrix.ldflags }}" -o bin/${{ matrix.output }} ./cmd/daemon

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: bin/${{ matrix.output }}

  build-macos:
    name: Build macOS Universal (Intel + Apple Silicon)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Compile Universal Mach-O Binary
        run: |
          mkdir -p bin
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -ldflags "-s -w" -o bin/mac-arm64 ./cmd/daemon
          GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build -ldflags "-s -w" -o bin/mac-intel ./cmd/daemon
          lipo -create -output bin/CloudflareNetConnect-mac-universal bin/mac-arm64 bin/mac-intel
          chmod +x bin/CloudflareNetConnect-mac-universal

      - name: Upload macOS Universal
        uses: actions/upload-artifact@v4
        with:
          name: CloudflareNetConnect-mac-universal
          path: bin/CloudflareNetConnect-mac-universal
